<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إرسال التنبيهات الآلية - واتساب</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen">

    <header class="bg-[#0A2540] text-white p-4 text-center shadow">
        <h1 class="text-lg font-bold">نظام تنبيهات الاشتراكات الآلي (واتساب)</h1>
        <p class="text-xs text-emerald-400 mt-1">إرسال في الخلفية • حماية ضد الحظر</p>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-6">
        
        <!-- Tab Switcher -->
        <div class="grid grid-cols-2 gap-4">
            <button onclick="switchTab('today')" id="tabToday" class="bg-red-600 text-white font-bold py-3 rounded-xl shadow transition text-center">
                🚨 تنتهي اليوم (<span id="countToday">0</span>)
            </button>
            <button onclick="switchTab('week')" id="tabWeek" class="bg-amber-500 text-white font-bold py-3 rounded-xl shadow transition text-center">
                ⚠️ تنتهي خلال أسبوع (<span id="countWeek">0</span>)
            </button>
        </div>

        <!-- Container List -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden p-4">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h2 id="listTitle" class="font-bold text-gray-700 text-sm">المشتركين الذين تنتهي اشتراكاتهم اليوم</h2>
                <button onclick="loadData()" class="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg font-medium">تحديث القائمة 🔄</button>
            </div>

            <div id="subscribersContainer" class="space-y-3">
                <!-- Data injected here -->
            </div>
        </div>

    </main>

    <script>
        let currentTab = 'today';
        let globalData = { today: [], week: [] };

        async function loadData() {
            try {
                const res = await fetch('http://localhost:3000/api/subscribers-status');
                globalData = await res.json();
                
                document.getElementById('countToday').textContent = globalData.today.length;
                document.getElementById('countWeek').textContent = globalData.week.length;
                renderList();
            } catch (err) {
                document.getElementById('subscribersContainer').innerHTML = '<p class="text-center text-red-500 text-xs py-4">تعذر الاتصال بالسيرفر الخلفي (تأكد من تشغيل Node.js server.js).</p>';
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            const tToday = document.getElementById('tabToday');
            const tWeek = document.getElementById('tabWeek');

            if (tab === 'today') {
                tToday.classList.add('ring-4', 'ring-red-200');
                tWeek.classList.remove('ring-4', 'ring-amber-200');
                document.getElementById('listTitle').textContent = 'المشتركين الذين تنتهي اشتراكاتهم اليوم';
            } else {
                tWeek.classList.add('ring-4', 'ring-amber-200');
                tToday.classList.remove('ring-4', 'ring-red-200');
                document.getElementById('listTitle').textContent = 'المشتركين الذين تنتهي اشتراكاتهم خلال أسبوع';
            }
            renderList();
        }

        function renderList() {
            const container = document.getElementById('subscribersContainer');
            container.innerHTML = '';

            const list = globalData[currentTab] || [];

            if (list.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-400 text-xs py-8">لا توجد اشتراكات في هذه الفئة حالياً ✓</p>';
                return;
            }

            list.forEach(sub => {
                const card = document.createElement('div');
                card.className = 'bg-gray-50 p-4 rounded-xl border border-gray-200 flex justify-between items-center';
                
                const defaultMsg = `مرحباً المشترك العزيز ${sub.fullName}، نود تذكيركم بأن اشتراككم في خدمة الفايبر (FTTH) سينتهي بتاريخ ${sub.expireDate}. يرجى التجديد استمراراً للخدمة.`;

                card.innerHTML = `
                    <div>
                        <h3 class="font-bold text-gray-800 text-sm">${sub.fullName}</h3>
                        <p class="text-xs text-gray-500">الحساب: <span class="text-blue-600">${sub.username}</span> | الهاتف: ${sub.phone}</p>
                        <p class="text-[11px] text-red-500 font-medium mt-1">تاريخ الانتهاء: ${sub.expireDate}</p>
                    </div>
                    <div>
                        <button id="btn-${sub.id}" onclick="sendWhatsApp('${sub.phone}', \`${defaultMsg}\`, '${sub.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow transition flex items-center gap-1.5">
                            إرسال واتساب 📤
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function sendWhatsApp(phone, message, id) {
            if (!phone || phone === 'غير متوفر') {
                alert('رقم هاتف المشترك غير متوفر أو غير صالح.');
                return;
            }

            const btn = document.getElementById(`btn-${id}`);
            btn.disabled = true;
            btn.textContent = 'جاري الإرسال...';
            btn.className = 'bg-gray-400 text-white px-4 py-2 rounded-xl text-xs font-bold cursor-not-allowed';

            try {
                const res = await fetch('http://localhost:3000/api/send-whatsapp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, message })
                });

                const data = await res.json();
                if (data.success) {
                    btn.textContent = 'تم الإرسال ✓';
                    btn.className = 'bg-emerald-100 text-emerald-700 px-4 py-2 rounded-xl text-xs font-bold';
                } else {
                    throw new Error(data.error);
                }
            } catch (err) {
                alert('فشل الإرسال: تأكد من ربط واتساب وتفعيل السيرفر.');
                btn.disabled = false;
                btn.textContent = 'إعادة المحاولة';
                btn.className = 'bg-red-600 text-white px-4 py-2 rounded-xl text-xs font-bold';
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
